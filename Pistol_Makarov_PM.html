<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Manual Model Adjuster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; display: block; touch-action: none; }
  
  .ui-overlay {
    position: absolute; top: 10px; left: 10px; right: 10px;
    background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(10px);
    padding: 15px; border-radius: 10px; color: #fff; border-left: 4px solid #ffaa00;
    pointer-events: auto;
  }
  .ui-overlay h1 { font-size: 1rem; color: #ffaa00; margin-bottom: 5px; }
  .ui-overlay p { font-size: 0.8rem; color: #ccc; line-height: 1.5; }
  
  .panel {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 8px;
    display: flex; gap: 10px; pointer-events: auto;
  }
  button {
    background: #333; color: #fff; border: 1px solid #555; padding: 10px 15px;
    border-radius: 5px; font-size: 0.9rem; cursor: pointer; pointer-events: auto;
  }
  button:hover { background: #ffaa00; color: #000; border-color: #ffaa00; }
</style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-overlay">
    <h1>🛠️ Model Fixer (Manual Adjust)</h1>
    <p>Drag karke parts nu sahi jagah te lao (Gun left, Bullets right etc).<br>Jadon set ho jaye, taan niche wale button te click karo taaki tusi tuhadi <b>Position Code</b> copy kar sako.</p>
  </div>

  <div class="panel">
    <button id="btn-print">Get Fixed Code</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // Controls (Enable Pan to move objects)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = true; 
    controls.autoRotate = true;

    // Load Model
    const loader = new THREE.GLTFLoader();
    let allMeshes = []; // Store meshes for printing later

    loader.load('Pistol_Makarov_PM.glb', function (gltf) {
      const gunModel = gltf.scene;

      // Apply Materials & Collect meshes
      gunModel.traverse((node) => {
        if (node.isMesh) {
          node.material = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.3 });
          allMeshes.push(node);
        }
      });

      // Center whole model
      const box = new THREE.Box3().setFromObject(gunModel);
      const center = box.getCenter(new THREE.Vector3());
      gunModel.position.sub(center);

      scene.add(gunModel);
      
      // Fit camera
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      camera.position.set(0, maxDim * 0.5, maxDim * 2);
      controls.target.set(0, 0, 0);
    });

    // PRINT CODE LOGIC
    document.getElementById('btn-print').addEventListener('click', () => {
      let codeOutput = "// Eh code copy karo te apne main file vich load function de andar pao:\n\n";
      
      allMeshes.forEach((mesh) => {
        // Get local position relative to parent
        const p = mesh.position;
        codeOutput += `gunModel.getObjectByName("${mesh.name}").position.set(${p.x.toFixed(3)}, ${p.y.toFixed(3)}, ${p.z.toFixed(3)});\n`;
      });

      console.log(codeOutput);
      alert("Code Console vich print ho geya hai! F12 dabo te Console tab kholo, othe code copy kar lo. (Je names khali ne, taan matlab model vich names nahi ne).");
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
