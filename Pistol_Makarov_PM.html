<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Real 3D Model Fixer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; display: block; touch-action: none; cursor: grab; }
  #canvas-container:active { cursor: grabbing; }
  
  .ui-overlay {
    position: absolute; top: 10px; left: 10px; right: 10px;
    background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(10px);
    padding: 15px; border-radius: 10px; color: #fff; border-left: 4px solid #ffaa00;
    pointer-events: none;
  }
  .ui-overlay h1 { font-size: 1rem; color: #ffaa00; margin-bottom: 5px; }
  .ui-overlay p { font-size: 0.8rem; color: #ccc; line-height: 1.5; }
  
  .panel {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 8px;
    display: flex; gap: 10px; pointer-events: auto; z-index: 10;
  }
  button {
    background: #333; color: #fff; border: 1px solid #555; padding: 10px 15px;
    border-radius: 5px; font-size: 0.9rem; cursor: pointer;
  }
  button:hover { background: #ffaa00; color: #000; border-color: #ffaa00; }
  
  /* Hidden textarea to show code */
  #output { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 100; background: #000; color: #0f0; padding: 20px; font-family: monospace; border: none; resize: none; }
</style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-overlay">
    <h1>🛠️ REAL 3D Fixer (Drag Objects)</h1>
    <p><b>Object te click karo te ohnu drag karo</b> (jo bhi part select hoga, oh move hoga).<br>Jadon sahi jagah te rakh lo, taan "Get Code" dabo.</p>
  </div>

  <div class="panel">
    <button id="btn-print">Get Fixed Code</button>
  </div>

  <textarea id="output" readonly></textarea>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // Controls for Camera
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false; // Keep pan false so objects can be dragged easily

    // Drag Controls (The Magic)
    let dragControls;
    let allMeshes = [];

    // Load Model
    const loader = new THREE.GLTFLoader();

    loader.load('Pistol_Makarov_PM.glb', function (gltf) {
      const gunModel = gltf.scene;

      // Apply Materials & Collect meshes
      gunModel.traverse((node) => {
        if (node.isMesh) {
          node.material = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.3 });
          allMeshes.push(node);
        }
      });

      // Center whole model initially
      const box = new THREE.Box3().setFromObject(gunModel);
      const center = box.getCenter(new THREE.Vector3());
      gunModel.position.sub(center);

      scene.add(gunModel);
      
      // Setup DragControls AFTER model is loaded
      dragControls = new THREE.DragControls(allMeshes, camera, renderer.domElement);
      
      // Pause auto-rotate when dragging
      dragControls.addEventListener('dragstart', function () {
        controls.enabled = false;
      });
      dragControls.addEventListener('dragend', function () {
        controls.enabled = true;
      });

      // Fit camera
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      camera.position.set(0, maxDim * 0.5, maxDim * 2);
      controls.target.set(0, 0, 0);
    });

    // PRINT CODE LOGIC
    document.getElementById('btn-print').addEventListener('click', () => {
      let codeOutput = `// Eh code copy karo te apne main file vich loader.load de andar pao:\n\n`;
      
      allMeshes.forEach((mesh) => {
        const p = mesh.position;
        // Use userData to store original name if it exists
        const meshName = mesh.name || "unnamed";
        codeOutput += `gunModel.getObjectByName("${meshName}").position.set(${p.x.toFixed(3)}, ${p.y.toFixed(3)}, ${p.z.toFixed(3)});\n`;
      });

      console.log(codeOutput);
      
      // Show in textarea
      const out = document.getElementById('output');
      out.value = codeOutput;
      out.style.display = 'block';
      
      // Add a close button dynamically
      const closeBtn = document.createElement('button');
      closeBtn.innerText = "Close";
      closeBtn.style.position = "absolute";
      closeBtn.style.top = "20px";
      closeBtn.style.right = "20px";
      closeBtn.style.zIndex = "101";
      closeBtn.style.background = "red";
      closeBtn.onclick = () => { out.style.display = 'none'; closeBtn.remove(); };
      document.body.appendChild(closeBtn);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
