<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PM Makarov .177 Cal — Fixed Model</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; display: block; touch-action: none; }
  .ui-overlay {
    position: absolute; top: max(16px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left));
    pointer-events: none; background: rgba(20, 20, 20, 0.75); backdrop-filter: blur(12px);
    padding: 14px 18px; border-radius: 10px; color: #fff; border-left: 4px solid #8b3a3a;
  }
  .ui-overlay h1 { font-size: 1.1rem; color: #e0e0e0; }
  .ui-overlay p { font-size: 0.75rem; color: #ccc; margin-top: 5px; }
  .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ccc; letter-spacing: 3px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="ui-overlay" id="ui">
    <h1>PM Makarov</h1>
    <p>👆 Drag to Rotate | 🤏 Pinch to Zoom</p>
  </div>
  <div class="loading" id="loader">LOADING...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    // 1. SCENE SETUP
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 2. LIGHTING
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);
    const fillLight = new THREE.PointLight(0xffffff, 1);
    fillLight.position.set(-5, 5, 5);
    scene.add(fillLight);

    // 3. ENVIRONMENT MAP (For Black Metal Shine)
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envCanvas = document.createElement('canvas');
    envCanvas.width = 512; envCanvas.height = 256;
    const ctx = envCanvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, '#111'); grad.addColorStop(0.5, '#fff'); grad.addColorStop(1, '#000');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, 512, 256);
    const envTex = new THREE.CanvasTexture(envCanvas);
    envTex.mapping = THREE.EquirectangularReflectionMapping;
    const envMap = pmrem.fromEquirectangular(envTex).texture;
    scene.environment = envMap;

    // 4. CONTROLS
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.5;

    // 5. LOAD MODEL WITH FIX LOGIC
    const loader = new THREE.GLTFLoader();
    
    loader.load('Pistol_Makarov_PM.glb', function (gltf) {
      const gunModel = gltf.scene;

      // --- 🔥 FIX 1: HIDE BULLETS & INNER PARTS ---
      gunModel.traverse((node) => {
        if (node.isMesh) {
          const name = node.name.toLowerCase();
          
          // Jithe vi bullet, bb, ammo, round likhya hai, ohnu hide karo
          if (/bullet|ammo|projectile|cartridge|bb|pellet|round|magazine/.test(name)) {
            node.visible = false;
            return;
          }

          // Material Apply (Black Metal)
          node.material = new THREE.MeshStandardMaterial({
            color: 0x111111,
            metalness: 0.9,
            roughness: 0.2,
            envMap: envMap
          });
        }
      });

      // --- 🔥 FIX 2: FORCE HORIZONTAL & CENTER ---
      // Pura model center karo
      const box = new THREE.Box3().setFromObject(gunModel);
      const center = box.getCenter(new THREE.Vector3());
      gunModel.position.sub(center);

      // Agar Slide khadi (vertical) hai, taan ohnu wajah karo
      const size = box.getSize(new THREE.Vector3());
      if (size.y > size.x && size.y > size.z) {
        gunModel.rotation.z = Math.PI / 2; // Khadi nu lita do
      }

      // Camera de aage set karo (taaki goli aage nikle)
      gunModel.rotation.y = Math.PI / 2; 

      // Model nu scene vich add karo
      const wrapper = new THREE.Group();
      wrapper.add(gunModel);
      scene.add(wrapper);

      // Auto fit camera
      const maxDim = Math.max(size.x, size.y, size.z);
      camera.position.set(0, maxDim * 0.5, maxDim * 2);
      controls.target.set(0, 0, 0);
      controls.update();

      document.getElementById('loader').classList.add('hidden');
    }, undefined, function (error) {
      document.getElementById('loader').innerText = "Error: GLB File not found!";
    });

    // 6. ANIMATION LOOP
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
