<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PM Makarov - Real Textures</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #111111; /* Dark background like Sketchfab */
    font-family: -apple-system, 'Segoe UI', sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }

  #canvas-container { width: 100vw; height: 100vh; display: block; touch-action: none; }
  #canvas-container canvas { display: block; touch-action: none; }

  .ui-overlay {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    pointer-events: none;
    background: rgba(20, 20, 20, 0.7);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding: 12px 16px;
    border-radius: 8px;
    color: #fff;
    border-left: 3px solid #8b3a3a;
  }
  .ui-overlay h1 { font-size: 1rem; color: #eee; font-weight: 600; margin-bottom: 4px; }
  .ui-overlay p { font-size: 0.75rem; color: #aaa; }

  .loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #ccc; font-size: 1rem;
    text-align: center; letter-spacing: 2px;
    pointer-events: none;
  }
  .hidden { opacity: 0; transition: opacity 0.5s; }
  .error-msg { color: #ff5c5c !important; font-weight: bold; }

  @media (max-width: 600px) {
    .ui-overlay { padding: 8px 12px; }
    .ui-overlay h1 { font-size: 0.9rem; }
    .ui-overlay p { font-size: 0.65rem; }
  }
</style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-overlay" id="ui">
    <h1>PM Makarov</h1>
    <p>👆 Drag to Rotate | 🤏 Pinch to Zoom</p>
  </div>

  <div class="loading" id="loader">LOADING...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    // 1. SCENE SETUP
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111); // Sketchfab dark grey

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    // Enable proper color rendering for textures
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    
    container.appendChild(renderer.domElement);

    renderer.domElement.style.touchAction = 'none';
    renderer.domElement.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    renderer.domElement.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    // 2. LIGHTING (Studio Setup)
    scene.add(new THREE.AmbientLight(0xffffff, 0.4)); // Soft ambient
    
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
    keyLight.position.set(5, 10, 7);
    scene.add(keyLight);
    
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
    fillLight.position.set(-5, 5, 5);
    scene.add(fillLight);
    
    const rimLight = new THREE.DirectionalLight(0xffffff, 0.5);
    rimLight.position.set(0, -5, -5);
    scene.add(rimLight);

    // 3. CONTROLS
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.0;
    controls.enablePan = false;
    controls.minDistance = 2;
    controls.maxDistance = 15;

    // Pause auto-rotate on drag
    controls.addEventListener('start', () => controls.autoRotate = false);
    controls.addEventListener('end', () => {
      setTimeout(() => controls.autoRotate = true, 2000);
    });

    // 4. LOAD MODEL (Keep Original Textures)
    const loaderEl = document.getElementById('loader');
    const loader = new THREE.GLTFLoader();
    
    loader.load('Pistol_Makarov_PM.glb', function (gltf) {
      const gunModel = gltf.scene;

      // 🔥 IMPORTANT: We are NOT changing materials here.
      // We are keeping the original Sketchfab textures (Brown grip, metal, etc.)
      
      gunModel.traverse((node) => {
        if (node.isMesh) {
          // Just ensure textures are rendered in correct color space
          if (node.material.map) {
            node.material.map.encoding = THREE.sRGBEncoding;
          }
        }
      });

      // Center and rotate the model perfectly
      const box = new THREE.Box3().setFromObject(gunModel);
      const center = box.getCenter(new THREE.Vector3());
      gunModel.position.sub(center);

      const size = box.getSize(new THREE.Vector3());
      
      // If model is vertical, lay it down horizontally
      if (size.y > size.x && size.y > size.z) {
        gunModel.rotation.z = -Math.PI / 2; 
      }
      
      // Face the barrel towards the camera
      gunModel.rotation.y = Math.PI / 2; 

      const wrapper = new THREE.Group();
      wrapper.add(gunModel);
      scene.add(wrapper);

      // Auto-fit camera
      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = maxDim * 1.8;
      
      camera.position.set(0, maxDim * 0.3, dist);
      camera.near = maxDim * 0.01;
      camera.far = maxDim * 200;
      camera.updateProjectionMatrix();

      controls.target.set(0, 0, 0);
      controls.minDistance = maxDim * 0.5;
      controls.maxDistance = maxDim * 5;
      controls.update();

      // Hide loading screen
      loaderEl.classList.add('hidden');
      setTimeout(() => loaderEl.style.display = 'none', 500);

    }, 
    function (xhr) {
      if (xhr.total) {
        loaderEl.innerText = `LOADING ${Math.round((xhr.loaded / xhr.total) * 100)}%`;
      }
    }, 
    function (error) {
      console.error('GLB load failed:', error);
      loaderEl.innerHTML = '<span class="error-msg">⚠️ Failed to load Pistol_Makarov_PM.glb</span>';
    });

    // 5. ANIMATION LOOP
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 6. RESIZE
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
