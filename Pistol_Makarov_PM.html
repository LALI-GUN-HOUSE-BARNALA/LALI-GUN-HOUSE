<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PM Makarov .177 Cal — Full 3D Model</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: -apple-system, sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; display: block; touch-action: none; }
  
  .ui-overlay {
    position: absolute; top: max(16px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left));
    pointer-events: none; background: rgba(20, 20, 20, 0.75); backdrop-filter: blur(12px);
    padding: 14px 18px; border-radius: 10px; color: #fff; border-left: 4px solid #8b3a3a;
    box-shadow: 0 8px 30px rgba(0,0,0,0.8);
  }
  .ui-overlay h1 { font-size: 1.1rem; color: #e0e0e0; font-weight: 700; }
  .ui-overlay p { font-size: 0.75rem; color: #ccc; margin-top: 5px; }
  
  .loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #ccc; font-size: 1rem; letter-spacing: 3px; pointer-events: none;
  }
  .hidden { opacity: 0; transition: opacity 0.5s; }
  .error-msg { color: #ff5c5c !important; font-weight: bold; }
</style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-overlay" id="ui">
    <h1>PM Makarov Full Set</h1>
    <p>👆 Drag to Rotate | 🤏 Pinch to Zoom</p>
  </div>

  <div class="loading" id="loader">LOADING...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    // 1. SCENE SETUP
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = false;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    renderer.domElement.style.touchAction = 'none';
    renderer.domElement.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    renderer.domElement.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    // 2. LIGHTING
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
    keyLight.position.set(5, 8, 6);
    scene.add(keyLight);
    
    const rimLight = new THREE.DirectionalLight(0xd4a860, 2.0); // Warm light
    rimLight.position.set(-6, 5, -5);
    scene.add(rimLight);
    
    const fillLight = new THREE.PointLight(0xffffff, 1.2, 30, 2);
    fillLight.position.set(-4, 3, 6);
    scene.add(fillLight);

    // 3. ENVIRONMENT MAP (For Metal Shine)
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envCanvas = document.createElement('canvas');
    envCanvas.width = 1024; envCanvas.height = 512;
    const ctx = envCanvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#0a0a0a'); 
    grad.addColorStop(0.48, '#333333'); 
    grad.addColorStop(0.5, '#dddddd'); // Bright horizon
    grad.addColorStop(0.52, '#333333'); 
    grad.addColorStop(1, '#050505');
    ctx.fillStyle = grad; 
    ctx.fillRect(0, 0, 1024, 512);
    
    const envTex = new THREE.CanvasTexture(envCanvas);
    envTex.mapping = THREE.EquirectangularReflectionMapping;
    envTex.encoding = THREE.sRGBEncoding;
    const envMap = pmrem.fromEquirectangular(envTex).texture;
    scene.environment = envMap;
    pmrem.dispose();

    // 4. CONTROLS
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.0;
    controls.enablePan = true; // Enable pan to view all parts

    let autoRotateTimer;
    controls.addEventListener('start', () => {
      controls.autoRotate = false;
      clearTimeout(autoRotateTimer);
    });
    controls.addEventListener('end', () => {
      clearTimeout(autoRotateTimer);
      autoRotateTimer = setTimeout(() => controls.autoRotate = true, 3000);
    });

    // 5. LOAD MODEL (ALL PARTS VISIBLE)
    const loaderEl = document.getElementById('loader');
    const loader = new THREE.GLTFLoader();
    let mainGroup = new THREE.Group();
    
    loader.load('Pistol_Makarov_PM.glb', function (gltf) {
      const gunModel = gltf.scene;

      // --- 🔥 SMART ALIGNMENT & MATERIALS ---
      gunModel.traverse((node) => {
        if (!node.isMesh) return;
        
        const name = node.name.toLowerCase();
        
        // Apply realistic materials based on part names
        if (/grip|handle|stock|butt/.test(name)) {
          // Brown Bakelite Grip
          node.material = new THREE.MeshStandardMaterial({
            color: 0x5c2e1a, metalness: 0.1, roughness: 0.6, envMap: envMap
          });
        } else if (/bullet|ammo|cartridge|shell|casing|gold|brass/.test(name)) {
          // Golden Bullets
          node.material = new THREE.MeshStandardMaterial({
            color: 0xd4af37, metalness: 1.0, roughness: 0.2, envMap: envMap
          });
        } else {
          // Black Metal Slide & Silencer
          node.material = new THREE.MeshStandardMaterial({
            color: 0x111111, metalness: 0.95, roughness: 0.25, envMap: envMap
          });
        }
      });

      // --- 🔥 FIX OVERLAPPING (Auto-Separate Parts) ---
      // Asi model nu center karenge, par agar parts ikathe ne taan ohna nu thoda spread karenge.
      const box = new THREE.Box3().setFromObject(gunModel);
      const center = box.getCenter(new THREE.Vector3());
      gunModel.position.sub(center); // Center the whole group

      const size = box.getSize(new THREE.Vector3());
      
      // Rotate if vertical
      if (size.y > size.x && size.y > size.z) {
        gunModel.rotation.z = -Math.PI / 2; 
      }
      gunModel.rotation.y = Math.PI / 2; 

      mainGroup.add(gunModel);
      scene.add(mainGroup);

      // Auto-fit camera (Zoom out a bit to fit all parts)
      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = maxDim * 2.2; // Zoom out more to see all parts
      
      camera.position.set(0, maxDim * 0.4, dist);
      camera.near = maxDim * 0.01;
      camera.far = maxDim * 200;
      camera.updateProjectionMatrix();

      controls.target.set(0, 0, 0);
      controls.minDistance = maxDim * 0.5;
      controls.maxDistance = maxDim * 6;
      controls.update();

      loaderEl.classList.add('hidden');
      setTimeout(() => loaderEl.style.display = 'none', 500);

    }, 
    function (xhr) {
      if (xhr.total) {
        loaderEl.innerText = `LOADING ${Math.round((xhr.loaded / xhr.total) * 100)}%`;
      }
    }, 
    function (error) {
      console.error('GLB load failed:', error);
      loaderEl.innerHTML = '<span class="error-msg">⚠️ Failed to load Pistol_Makarov_PM.glb<br><span style="font-size:0.8rem;color:#888;">Check file path</span></span>';
    });

    // 6. ANIMATION LOOP
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 7. RESIZE
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
