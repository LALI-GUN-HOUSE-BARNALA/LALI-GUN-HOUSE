<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PM Makarov - Black & Reflective</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0a0a; /* Deep dark background */
    font-family: -apple-system, 'Segoe UI', sans-serif;
    overscroll-behavior: none;
  }

  #canvas-container { width: 100vw; height: 100vh; display: block; touch-action: none; }
  #canvas-container canvas { display: block; touch-action: none; }

  .ui-overlay {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    pointer-events: none;
    background: rgba(20, 20, 20, 0.6);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding: 12px 16px;
    border-radius: 8px;
    color: #fff;
    border-left: 3px solid #666;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .ui-overlay h1 { font-size: 1rem; color: #eee; font-weight: 600; margin-bottom: 4px; }
  .ui-overlay p { font-size: 0.75rem; color: #aaa; }

  .loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #ccc; font-size: 1rem;
    text-align: center; letter-spacing: 2px;
    pointer-events: none;
  }
  .hidden { opacity: 0; transition: opacity 0.5s; }
</style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-overlay" id="ui">
    <h1>PM Makarov Black Edition</h1>
    <p>👆 Drag to Rotate | 🤏 Pinch to Zoom</p>
  </div>

  <div class="loading" id="loader">LOADING...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    // 1. SCENE & RENDERER SETUP
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a); // Dark Background

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Mobile Safe
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3; // Thoda tez taaki reflection dikhe
    container.appendChild(renderer.domElement);

    // Touch fixes
    renderer.domElement.style.touchAction = 'none';
    renderer.domElement.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    renderer.domElement.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    // 2. LIGHTING (Zabardast Reflection layi)
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    
    // Main Key Light
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
    keyLight.position.set(5, 8, 5);
    scene.add(keyLight);
    
    // Rim Light (Pichhe ton)
    const rimLight = new THREE.DirectionalLight(0xaabbff, 2.0);
    rimLight.position.set(-5, 5, -5);
    scene.add(rimLight);
    
    // Fill Light
    const fillLight = new THREE.PointLight(0xffffff, 1.5, 30, 2);
    fillLight.position.set(-3, 2, 6);
    scene.add(fillLight);

    // 3. ENVIRONMENT MAP (For Black Metal Shine)
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envCanvas = document.createElement('canvas');
    envCanvas.width = 1024; envCanvas.height = 512;
    const ctx = envCanvas.getContext('2d');
    
    // Gradient banaya taaki Black metal te saaf chamak (studio strips) aave
    const grad = ctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#111'); 
    grad.addColorStop(0.45, '#333'); 
    grad.addColorStop(0.5, '#ffffff'); // Bright horizon
    grad.addColorStop(0.55, '#333'); 
    grad.addColorStop(1, '#000');
    ctx.fillStyle = grad; 
    ctx.fillRect(0, 0, 1024, 512);

    // Add some bright streaks for maximum reflection
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 40;
    ctx.shadowColor = '#ffffff';
    ctx.fillRect(200, 150, 30, 200);
    ctx.fillRect(700, 150, 30, 200);

    const envTex = new THREE.CanvasTexture(envCanvas);
    envTex.mapping = THREE.EquirectangularReflectionMapping;
    const envMap = pmrem.fromEquirectangular(envTex).texture;
    scene.environment = envMap;
    pmrem.dispose();

    // 4. CONTROLS
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.5;
    controls.enablePan = false;
    controls.minDistance = 2;
    controls.maxDistance = 15;

    controls.addEventListener('start', () => controls.autoRotate = false);
    controls.addEventListener('end', () => {
      setTimeout(() => controls.autoRotate = true, 2000);
    });

    // 5. LOAD MODEL & APPLY BLACK METAL MATERIAL
    const loaderEl = document.getElementById('loader');
    const loader = new THREE.GLTFLoader();
    
    loader.load('Pistol_Makarov_PM.glb', function (gltf) {
      const gunModel = gltf.scene;

      // 🔥 COLOR & REFLECTION LOGIC
      gunModel.traverse((node) => {
        if (node.isMesh) {
          // Saariya nu Black Metal material laga ditta
          node.material = new THREE.MeshStandardMaterial({
            color: 0x080808,       // Deep Black
            metalness: 1.0,        // Pure Metal (Full Reflection)
            roughness: 0.08,       // Mirror finish (Chamakdar)
            envMap: envMap,
            envMapIntensity: 2.5   // Reflection nu boost karan layi
          });
        }
      });

      // Center & Rotate
      const box = new THREE.Box3().setFromObject(gunModel);
      const center = box.getCenter(new THREE.Vector3());
      gunModel.position.sub(center);

      const size = box.getSize(new THREE.Vector3());
      
      // Horizontal align
      if (size.y > size.x && size.y > size.z) {
        gunModel.rotation.z = -Math.PI / 2; 
      }
      gunModel.rotation.y = Math.PI / 2; 

      scene.add(gunModel);

      // Auto-fit camera
      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = maxDim * 1.8;
      
      camera.position.set(0, maxDim * 0.3, dist);
      camera.near = maxDim * 0.01;
      camera.far = maxDim * 200;
      camera.updateProjectionMatrix();

      controls.target.set(0, 0, 0);
      controls.update();

      loaderEl.classList.add('hidden');
      setTimeout(() => loaderEl.style.display = 'none', 500);
    }, 
    function (xhr) {
      if (xhr.total) {
        loaderEl.innerText = `LOADING ${Math.round((xhr.loaded / xhr.total) * 100)}%`;
      }
    }, 
    function (error) {
      console.error('GLB load failed:', error);
      loaderEl.innerHTML = '<span style="color:red">⚠️ Failed to load Pistol_Makarov_PM.glb</span>';
    });

    // 6. ANIMATION LOOP
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 7. RESIZE
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
