<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Classic Rifle - Premium Wood Edition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0705; /* Dark warm background */
    font-family: -apple-system, 'Segoe UI', sans-serif;
    overscroll-behavior: none;
  }

  #canvas-container { width: 100vw; height: 100vh; display: block; touch-action: none; }
  #canvas-container canvas { display: block; touch-action: none; }

  .ui-overlay {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    pointer-events: none;
    background: rgba(20, 12, 6, 0.75);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding: 14px 20px;
    border-radius: 8px;
    color: #fff;
    border-left: 4px solid #c08840;
    box-shadow: 0 4px 15px rgba(0,0,0,0.8);
  }
  .ui-overlay h1 { font-size: 1.2rem; color: #d4a860; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.5px; }
  .ui-overlay p { font-size: 0.8rem; color: #ccc; text-transform: uppercase; letter-spacing: 1px; }

  .loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #d4a860; font-size: 1rem;
    text-align: center; letter-spacing: 2px;
    pointer-events: none;
  }
  .hidden { opacity: 0; transition: opacity 0.5s; }
</style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-overlay" id="ui">
    <h1>Classic Rifle</h1>
    <p>Premium Wood Edition</p>
  </div>

  <div class="loading" id="loader">LOADING...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    // 1. SCENE SETUP
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0705); // Dark background matching Winchester

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3; 
    container.appendChild(renderer.domElement);

    renderer.domElement.style.touchAction = 'none';
    renderer.domElement.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    renderer.domElement.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    // 2. LIGHTING (Cinematic Setup)
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    
    // Main Key Light (Ghumda rahega animation vich)
    const keyLight = new THREE.DirectionalLight(0xffffff, 3.0);
    keyLight.position.set(5, 8, 5);
    scene.add(keyLight);
    
    // Fill Light (Warm light wood layi)
    const fillLight = new THREE.DirectionalLight(0xffccaa, 1.5);
    fillLight.position.set(-5, 5, 5);
    scene.add(fillLight);
    
    // Rim Light (Pichhe ton pulse)
    const rimLight = new THREE.PointLight(0xd4a860, 2.5, 20, 2);
    rimLight.position.set(0, 5, -5);
    scene.add(rimLight);

    // 3. ENVIRONMENT MAP (For Wood Shine & Reflection)
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envCanvas = document.createElement('canvas');
    envCanvas.width = 1024; envCanvas.height = 512;
    const ctx = envCanvas.getContext('2d');
    
    // Rich Brown/Warm Gradient for reflection
    const grad = ctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#1a1005'); 
    grad.addColorStop(0.45, '#4a2c15'); 
    grad.addColorStop(0.5, '#ffeedd'); // Bright horizon
    grad.addColorStop(0.55, '#4a2c15'); 
    grad.addColorStop(1, '#0a0500');
    ctx.fillStyle = grad; 
    ctx.fillRect(0, 0, 1024, 512);

    // Add white streaks for extra reflection
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 40;
    ctx.shadowColor = '#ffffff';
    ctx.fillRect(250, 150, 40, 200);
    ctx.fillRect(750, 150, 40, 200);

    const envTex = new THREE.CanvasTexture(envCanvas);
    envTex.mapping = THREE.EquirectangularReflectionMapping;
    const envMap = pmrem.fromEquirectangular(envTex).texture;
    scene.environment = envMap;
    pmrem.dispose();

    // 4. CONTROLS (Zoom Fixed)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.2; 
    controls.enablePan = false;
    
    // 🔥 ZOOM SETTINGS
    controls.enableZoom = true;
    controls.zoomSpeed = 1.0;       
    controls.minDistance = 1.5;     
    controls.maxDistance = 20.0;    

    controls.addEventListener('start', () => controls.autoRotate = false);
    controls.addEventListener('end', () => {
      setTimeout(() => controls.autoRotate = true, 2500);
    });

    // 5. LOAD MODEL
    const loaderEl = document.getElementById('loader');
    const loader = new THREE.GLTFLoader();
    
    loader.load('rifle.glb', function (gltf) {
      const gunModel = gltf.scene;

      // 🔥 FULL BROWN & MAX REFLECTION LOGIC
      gunModel.traverse((node) => {
        if (node.isMesh) {
          node.material = new THREE.MeshStandardMaterial({
            color: 0x6b3e1b,       // Rich Wood Brown (Winchester style)
            metalness: 0.6,        // Metalness thodi vadhayi taaki khud nu reflect kare
            roughness: 0.15,       // Glossy finish (Zabardast chamak)
            envMap: envMap,
            envMapIntensity: 3.0   // Reflection max
          });
        }
      });

      // Center & Rotate
      const box = new THREE.Box3().setFromObject(gunModel);
      const center = box.getCenter(new THREE.Vector3());
      gunModel.position.sub(center);

      const size = box.getSize(new THREE.Vector3());
      
      // Rifle nu horizontal set karo
      if (size.y > size.x && size.y > size.z) {
        gunModel.rotation.z = -Math.PI / 2; 
      }
      // Barrel nu aage karo
      gunModel.rotation.y = Math.PI / 2; 

      const gunGroup = new THREE.Group();
      gunGroup.add(gunModel);
      scene.add(gunGroup);

      // Auto-fit camera
      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = maxDim * 1.6; 
      
      camera.position.set(0, maxDim * 0.2, dist);
      camera.near = maxDim * 0.01;
      camera.far = maxDim * 200;
      camera.updateProjectionMatrix();

      controls.minDistance = maxDim * 0.5; 
      controls.maxDistance = maxDim * 5;   
      
      controls.target.set(0, 0, 0);
      controls.update();

      loaderEl.classList.add('hidden');
      setTimeout(() => loaderEl.style.display = 'none', 500);

      // 🔥 TOP LEVEL ANIMATION LOOP
      const clock = new THREE.Clock();
      
      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        // Halka jeha float (Hawa vich)
        gunGroup.position.y = Math.sin(t * 1.2) * 0.05;
        gunGroup.rotation.z = Math.sin(t * 0.6) * 0.01;

        // Dynamic Light Animation (Roshni ghumdi rahegi jihde naal reflection live lagega)
        keyLight.position.x = Math.sin(t * 1.0) * 8;
        keyLight.position.z = Math.cos(t * 1.0) * 8;
        keyLight.position.y = 5 + Math.sin(t * 2.0) * 2;

        // Rim light pulse
        rimLight.intensity = 2.0 + Math.sin(t * 2.5) * 0.6;

        controls.update();
        renderer.render(scene, camera);
      }
      animate();

    }, 
    function (xhr) {
      if (xhr.total) {
        loaderEl.innerText = `LOADING ${Math.round((xhr.loaded / xhr.total) * 100)}%`;
      }
    }, 
    function (error) {
      console.error('GLB load failed:', error);
      loaderEl.innerHTML = '<span style="color:red">⚠️ Failed to load rifle.glb</span>';
    });

    // 6. RESIZE
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
